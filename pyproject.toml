[project]
name = "quote-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyiceberg[sql-sqlite,pyarrow]==0.12.0",
    "duckdb==1.5.5",
    "pyarrow==24.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
pipeline = "pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
